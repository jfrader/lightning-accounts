name: Deploy testnet

on:
  push:
    branches: [testnet]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-testnet
  cancel-in-progress: false

jobs:
  build-testnet-image:
    name: Build exact testnet image
    if: >-
      success() &&
      github.repository == 'jfrader/lightning-accounts' &&
      github.ref == 'refs/heads/testnet' &&
      vars.TESTNET_AUTO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PACKAGE: ghcr.io/jfrader/lightning-accounts-testnet
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build exact testnet image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          load: true
          platforms: linux/amd64
          tags: ${{ env.PACKAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=la-testnet
          cache-to: type=gha,mode=max,scope=la-testnet

      - name: Export digest
        id: digest
        run: |
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$PACKAGE:$GITHUB_SHA" | sed 's/.*@//')"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish exact testnet image
        run: docker push "$PACKAGE:$GITHUB_SHA"

    outputs:
      image-ref: ${{ env.PACKAGE }}:${{ github.sha }}@${{ steps.digest.outputs.digest }}

  deploy-testnet:
    name: Deploy veronica testnet
    needs: build-testnet-image
    if: >-
      success() &&
      github.repository == 'jfrader/lightning-accounts' &&
      github.ref == 'refs/heads/testnet' &&
      vars.TESTNET_AUTO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: testnet
      url: https://accounts.testnet.trucoshi.com
    steps:
      - name: Deploy exact testnet image to veronica
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"
          ssh -i "$RUNNER_TEMP/deploy_key" \
            -o StrictHostKeyChecking=accept-new \
            -o IdentitiesOnly=yes \
            -p 11122 la-testnet-deploy@jfrader.com \
            "$RELEASE_SHA"
