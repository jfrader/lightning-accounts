name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/security-audit

  development-docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build development image
        run: docker build --file Dockerfile --tag lightning-accounts-development:ci .
      - name: Verify bundled Yarn
        run: |
          actual_version="$(docker run --rm --entrypoint yarn lightning-accounts-development:ci --version)"
          echo "Bundled Yarn: ${actual_version}"
          test "${actual_version}" = "1.22.22"

  production-docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build production image
        run: docker build --file Dockerfile.prod --tag lightning-accounts-production:ci .

  unit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Enable pinned Yarn
        run: |
          corepack enable
          yarn --version
      - run: yarn install --frozen-lockfile --production=false
      - run: yarn prisma generate
      - run: yarn lint
      - run: yarn prettier
      - name: Run unit tests
        run: yarn test:unit
        env:
          NODE_ENV: test
          NODE_ORIGIN: http://localhost:3000
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
          JWT_SECRET: ci-jwt-secret
          JWT_BASE64_PUBLIC_KEY: Y2ktcHVibGljLWtleQ==
          JWT_BASE64_PRIVATE_KEY: Y2ktcHJpdmF0ZS1rZXk=
          SEED_HASH_SECRET: ci-seed-secret
          WALLET_ENABLED: "0"
      - run: yarn build

  # The image is built in the private jfrader/lightning-accounts-testnet repo
  # so the package is not linked to this public repository.
  dispatch-testnet-image:
    name: Dispatch private testnet image
    needs:
      - development-docker-image
      - production-docker-image
      - unit-and-build
      - security-audit
    if: >-
      success() &&
      github.repository == 'jfrader/lightning-accounts' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/testnet' &&
      vars.TESTNET_AUTO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    concurrency:
      group: testnet-dispatch
      cancel-in-progress: false
    steps:
      - name: Trigger the private testnet workflow
        env:
          DISPATCH_KEY: ${{ secrets.TESTNET_DISPATCH_KEY }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${DISPATCH_KEY:?missing TESTNET_DISPATCH_KEY secret}"
          latest="$(git ls-remote https://github.com/jfrader/lightning-accounts.git refs/heads/testnet | cut -f1)"
          if [[ "$latest" != "$RELEASE_SHA" ]]; then
            printf 'Skipping %s: testnet is at %s\n' "$RELEASE_SHA" "$latest"
            exit 0
          fi
          umask 077
          printf '%s\n' "$DISPATCH_KEY" > "$RUNNER_TEMP/dispatch_key"
          chmod 600 "$RUNNER_TEMP/dispatch_key"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/dispatch_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth=1 git@github.com:jfrader/lightning-accounts-testnet.git "$RUNNER_TEMP/dispatch"
          cd "$RUNNER_TEMP/dispatch"
          printf '%s\n' "$RELEASE_SHA" > release-sha
          git add release-sha
          if git diff --cached --quiet; then
            printf 'release-sha is already at %s\n' "$RELEASE_SHA"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "testnet ${RELEASE_SHA}"
          git push origin HEAD:master
          printf 'Dispatched testnet image build for %s\n' "$RELEASE_SHA"

# The transaction E2E suite provisions PostgreSQL plus Bitcoin/LND and remains in docker:test.
