name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/security-audit

  development-docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build development image
        run: docker build --file Dockerfile --tag lightning-accounts-development:ci .
      - name: Verify bundled Yarn
        run: |
          actual_version="$(docker run --rm --entrypoint yarn lightning-accounts-development:ci --version)"
          echo "Bundled Yarn: ${actual_version}"
          test "${actual_version}" = "1.22.22"

  production-docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build production image
        run: docker build --file Dockerfile.prod --tag lightning-accounts-production:ci .

  unit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Enable pinned Yarn
        run: |
          corepack enable
          yarn --version
      - run: yarn install --frozen-lockfile --production=false
      - run: yarn prisma generate
      - run: yarn lint
      - run: yarn prettier
      - name: Run unit tests
        run: yarn test:unit
        env:
          NODE_ENV: test
          NODE_ORIGIN: http://localhost:3000
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
          JWT_SECRET: ci-jwt-secret
          JWT_BASE64_PUBLIC_KEY: Y2ktcHVibGljLWtleQ==
          JWT_BASE64_PRIVATE_KEY: Y2ktcHJpdmF0ZS1rZXk=
          SEED_HASH_SECRET: ci-seed-secret
          WALLET_ENABLED: "0"
      - run: yarn build

  build-testnet-image:
    name: Build exact testnet image
    needs:
      - development-docker-image
      - production-docker-image
      - unit-and-build
      - security-audit
    if: >-
      success() &&
      github.repository == 'jfrader/lightning-accounts' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/testnet' &&
      vars.TESTNET_AUTO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      PACKAGE: ghcr.io/jfrader/lightning-accounts-testnet
    outputs:
      image-ref: ${{ steps.image-ref.outputs.value }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish exact testnet image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.prod
          push: true
          platforms: linux/amd64
          tags: ${{ env.PACKAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=la-testnet
          cache-to: type=gha,mode=max,scope=la-testnet

      - name: Export immutable image reference
        id: image-ref
        run: >-
          printf 'value=%s:%s@%s\n'
          "$PACKAGE" "$GITHUB_SHA" "${{ steps.build.outputs.digest }}"
          >> "$GITHUB_OUTPUT"

# The transaction E2E suite provisions PostgreSQL plus Bitcoin/LND and remains in docker:test.

  deploy-production:
    name: Deploy production
    needs:
      - security-audit
      - unit-and-build
      - production-docker-image
    if: >-
      success() &&
      github.repository == 'jfrader/lightning-accounts' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      vars.PRODUCTION_AUTO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: production
      url: https://accounts.trucoshi.com
    steps:
      - name: Deploy exact commit to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          : "${RENDER_API_KEY:?missing RENDER_API_KEY secret}"
          : "${RENDER_SERVICE_ID:?missing RENDER_SERVICE_ID variable}"
          payload=$(printf '{"commitId":"%s","clearCache":"do_not_clear"}' "$GITHUB_SHA")
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -o "$RUNNER_TEMP/deploy.json"
          deploy_id=$(jq -r '.id' "$RUNNER_TEMP/deploy.json")
          printf 'Triggered Render deploy %s for %s\n' "$deploy_id" "$GITHUB_SHA"
          for _ in $(seq 1 90); do
            status=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$deploy_id" |
              jq -r '.status')
            case "$status" in
              live) printf 'Deploy %s is live\n' "$deploy_id"; exit 0 ;;
              build_failed|pre_deploy_failed|update_failed|canceled) printf 'Deploy %s failed: %s\n' "$deploy_id" "$status" >&2; exit 1 ;;
            esac
            sleep 10
          done
          printf 'Deploy %s did not reach live in time\n' "$deploy_id" >&2
          exit 1
