name: Production dependency security gate
description: Block critical and high production findings; fail closed on incomplete audits.
runs:
  using: composite
  steps:
    - name: Enable pinned Yarn
      shell: bash
      run: corepack enable
    - name: Audit production dependencies
      shell: bash
      run: |
        output="$RUNNER_TEMP/production-audit.jsonl"
        yarn audit --groups dependencies --json >"$output" || true
        node - "$output" <<'NODE'
        const fs = require('node:fs');
        const counts = { info: 0, low: 0, moderate: 0, high: 0, critical: 0 };
        const blockers = new Set();
        let summary;
        try {
          const lines = fs.readFileSync(process.argv[2], 'utf8').trim().split('\n');
          for (const line of lines) {
            const { type, data } = JSON.parse(line);
            if (type === 'error') throw new Error(String(data));
            if (type === 'auditSummary') summary = data.vulnerabilities;
            if (type !== 'auditAdvisory') continue;
            const advisory = data.advisory;
            if (!Object.hasOwn(counts, advisory.severity)) {
              throw new Error('Unknown advisory severity');
            }
            counts[advisory.severity]++;
            if (advisory.severity === 'high' || advisory.severity === 'critical') {
              blockers.add(`${advisory.severity}: ${advisory.module_name} — ${advisory.title} (${advisory.url})`);
            }
          }
          if (!summary || Object.keys(counts).some(key => summary[key] !== counts[key])) {
            throw new Error('Missing or inconsistent audit summary');
          }
          console.log(`Production audit: ${counts.critical} critical, ${counts.high} high, ${counts.moderate} moderate, ${counts.low} low, ${counts.info} info.`);
          for (const blocker of blockers) console.error(`BLOCKED ${blocker}`);
          if (blockers.size) {
            console.error('FAIL: critical or high production findings block release.');
            process.exitCode = 1;
          } else {
            console.log('PASS: no critical or high production findings; moderate and low do not block release.');
          }
        } catch (error) {
          console.error(`FAIL: production audit could not be verified: ${error.message}`);
          process.exitCode = 1;
        }
        NODE
